name: macOS release candidate (arm64 PKG with Universal Zenz runtime, not notarized)

# Installable unsigned PKG for manual review: no CI installation or publication.
# Mozkey IbG: public macOS releases are built, signed and notarized only by
# release.yaml -> macos.yaml.  This manual workflow produces an unsigned
# candidate of the same arm64 application package (the Zenz runtime helpers are
# Universal) and additionally verifies its runtime natively on Intel.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact public version in src/version.bzl (e.g. 1.0.0)'
        type: string
        required: true

permissions:
  contents: read

env:
  MOZKEY_ZENZ_VERIFY_APP_ARCHITECTURES: arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_installable_candidate_arm64:
    name: Build installable arm64 PKG on Apple Silicon (no CI install)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      EXPECTED_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: Confirm native Apple Silicon and source identity
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = kazormia296/mozkey-ibg
          test "$(/usr/bin/uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 - <<'PYVERSION'
          import os
          from pathlib import Path
          import re

          requested = os.environ['EXPECTED_RELEASE_VERSION']
          assert re.fullmatch(r'(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)', requested), requested
          text = Path('src/version.bzl').read_text(encoding='utf-8')
          parts = []
          for part in ('MAJOR', 'MINOR', 'PATCH'):
              matches = re.findall(
                  rf'(?m)^MOZKEY_RELEASE_VERSION_{part}[ \t]*=[ \t]*([0-9]+)[ \t]*$',
                  text,
              )
              assert len(matches) == 1 and str(int(matches[0])) == matches[0], part
              parts.append(int(matches[0]))
          major, minor, patch = parts
          assert 0 <= major <= 155 and 0 <= minor <= 99 and 0 <= patch <= 99, parts
          assert requested == f'{major}.{minor}.{patch}', (requested, parts)
          print(f'RELEASE_SOURCE_VERSION=PASS ({requested}; PKG {100 + major}.{minor}.{patch})')
          PYVERSION
          /usr/bin/sw_vers
          bazelisk version
          echo "RELEASE_SOURCE_IDENTITY=PASS sha=$GITHUB_SHA version=$EXPECTED_RELEASE_VERSION"

      - name: Run 31 isolated macOS installer preflight fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 src/mac/preflight_mozkey_release_test.py

      - name: Prepare daily dictionary
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/dictionary/prepare_daily_dictionary.ps1 -ReleaseApprovedOnly

      - name: Restore dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: zenz-formal-update-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        working-directory: ./src
        shell: bash
        run: |
          set -euo pipefail
          python3 build_tools/update_deps.py

      - name: Build arm64 Qt
        working-directory: ./src
        shell: bash
        run: |
          set -euo pipefail
          python3 build_tools/build_qt.py --release --confirm_license --macos_cpus=arm64

      - name: Build and stage source-pinned Universal Zenz runtime
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          RUNTIME="$RUNNER_TEMP/mozkey-zenz-installable-candidate-runtime"
          test ! -e "$RUNTIME"
          # Use the tracked, lock-pinned source model; the builder verifies it.
          MOZKEY_ZENZ_MODEL_SOURCE="$GITHUB_WORKSPACE/src/win32/installer/zenz_runtime/models/zenz-v3.2-small-Q5_K_M.gguf" \
            src/mac/installer/zenz_runtime/build_universal_runtime.zsh "$RUNTIME"
          src/mac/installer/zenz_runtime/stage_runtime_assets.zsh "$RUNTIME"

      - name: Build separate installable candidate PKG (never install in CI)
        working-directory: ./src
        shell: bash
        run: |
          set -euo pipefail
          bazelisk \
            --output_user_root="$HOME/.cache/bazel_mozkey_zenz_installable_candidate" \
            build \
            --config=oss_macos \
            --config=release_build \
            --macos_cpus=arm64 \
            --define=mozkey_dictionary_profile=release-approved-only \
            --define=macos_zenz_runtime=1 \
            --define=MOZKEY_INSTALLABLE=1 \
            //mac:package \
            --verbose_failures

      - name: Capture package and source-build contract
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/installable-candidate"
          mkdir -p "$OUT"
          RELEASE_FILE="MozkeyIbG_v${EXPECTED_RELEASE_VERSION}_macos_arm64.pkg"
          test ! -e "$OUT/$RELEASE_FILE"
          install -m 0644 src/bazel-bin/mac/MozkeyIbG.pkg \
            "$OUT/$RELEASE_FILE"
          install -m 0644 src/mac/installer/zenz_runtime/BUILD-CONTRACT.txt \
            "$OUT/BUILD-CONTRACT.txt"
          PKG_SHA="$(/usr/bin/shasum -a 256 "$OUT/$RELEASE_FILE" | /usr/bin/awk '{print $1}')"
          CONTRACT_SHA="$(/usr/bin/shasum -a 256 "$OUT/BUILD-CONTRACT.txt" | /usr/bin/awk '{print $1}')"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "release_version=$EXPECTED_RELEASE_VERSION"
            echo "release_filename=$RELEASE_FILE"
            echo "package_sha256=$PKG_SHA"
            echo "build_contract_sha256=$CONTRACT_SHA"
            echo "candidate_type=explicit-installable-unsigned-release-candidate"
          } > "$OUT/ARTIFACT-CONTRACT.txt"
          cat "$OUT/ARTIFACT-CONTRACT.txt"

      - name: Verify exact package and packaged native scorer on Apple Silicon
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/installable-candidate"
          MOZKEY_ZENZ_EXPECTED_CONTRACT="$OUT/BUILD-CONTRACT.txt" \
          MOZKEY_ZENZ_VERIFY_BAZEL_ROOT="$HOME/.cache/bazel_mozkey_zenz_installable_candidate" \
            src/mac/installer/zenz_runtime/verify_release_package.zsh \
            "$OUT/MozkeyIbG_v${EXPECTED_RELEASE_VERSION}_macos_arm64.pkg" \
            "$OUT/arm64-verify"
          install -m 0644 "$OUT/arm64-verify/audit.txt" "$OUT/arm64-audit.txt"

      - name: Fail closed unless actual packaged preinstall is the release script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHK'
          import hashlib
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          # Read the checked-out release version; never trust dispatch labels.
          source_version = Path('src/version.bzl').read_text(encoding='utf-8')
          parts = []
          for component in ('MAJOR', 'MINOR', 'PATCH'):
              name = f'MOZKEY_RELEASE_VERSION_{component}'
              found = re.findall(
                  rf'(?m)^{name}[ \t]*=[ \t]*([0-9]+)[ \t]*$',
                  source_version)
              assert len(found) == 1, f'Invalid release version source: {name}'
              parts.append(int(found[0]))
          major, minor, patch = parts
          assert 0 <= major <= 155 and 0 <= minor <= 99 and 0 <= patch <= 99, (
              f'Invalid macOS installer release version: {parts}')
          expected_version = f'{100 + major}.{minor}.{patch}'

          out = Path('installable-candidate')
          unpacked = out / 'arm64-verify' / 'expanded'
          expected = Path('src/bazel-bin/mac/preflight.sh')
          preinstall = list(unpacked.rglob('preinstall'))
          assert len(preinstall) == 1 and preinstall[0].is_file(), f'Expected one packaged preinstall, got {preinstall}'
          assert expected.is_file(), 'Missing Bazel-generated source preflight'
          source = expected.read_bytes()
          packaged = preinstall[0].read_bytes()
          assert source == packaged, 'Packaged preinstall differs from Bazel-generated preflight'
          text = packaged.decode('utf-8')
          assert f"_mozkey_target='{expected_version}'" in text, 'Unexpected resolved Mozkey IbG installer version'
          assert "_mozkey_pkg_id='io.github.kazormia296.mozkey-ibg.pkg.JapaneseInput'" in text, 'Unexpected receipt identity'
          assert '_mozkey_valid_pkg_version' in text, 'Release preflight checks missing'
          assert 'PKG is NOT INSTALLABLE' not in text, 'Stage-1 guard unexpectedly packaged'
          assert '@@@MOZKEY_INSTALL_VERSION@@@' not in text, 'Version placeholder not resolved'
          package_infos = [p for p in unpacked.rglob('PackageInfo') if p.is_file()]
          assert len(package_infos) == 1, f'Expected one component PackageInfo, got {package_infos}'
          root = ET.parse(package_infos[0]).getroot()
          assert root.attrib.get('identifier') == 'io.github.kazormia296.mozkey-ibg.pkg.JapaneseInput', root.attrib
          assert root.attrib.get('version') == expected_version, root.attrib
          sha = hashlib.sha256(packaged).hexdigest()
          report = out / 'PREINSTALL-AUDIT.txt'
          report.write_text(
              'PACKAGED_RELEASE_PREFLIGHT=PASS\n'
              f'PACKAGE_RECEIPT_VERSION={expected_version}\n'
              f'PREINSTALL_SOURCE_SHA256={sha}\n'
              'PHYSICAL_INSTALL=NOT_PERFORMED\n',
              encoding='utf-8')
          print(report.read_text())
          PYCHK

      - name: Upload isolated installable candidate (not signed or notarized)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: mozkey-ibg-macos-arm64-unsigned-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            installable-candidate/MozkeyIbG_v*_macos_arm64.pkg
            installable-candidate/BUILD-CONTRACT.txt
            installable-candidate/ARTIFACT-CONTRACT.txt
            installable-candidate/PREINSTALL-AUDIT.txt
            installable-candidate/arm64-audit.txt
          if-no-files-found: error
          retention-days: 14

  verify_same_candidate_on_native_intel:
    name: Verify identical installable candidate on native Intel (without installing)
    needs: build_installable_candidate_arm64
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      EXPECTED_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout identical source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download exact candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: mozkey-ibg-macos-arm64-unsigned-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: installable-candidate

      - name: Verify x86_64 and artifact identity
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          test "$(/usr/bin/uname -m)" = x86_64
          OUT="$GITHUB_WORKSPACE/installable-candidate"
          CONTRACT="$OUT/ARTIFACT-CONTRACT.txt"
          EXPECTED_SHA="$(/usr/bin/awk -F= '$1 == "package_sha256" {print $2}' "$CONTRACT")"
          SOURCE_SHA="$(/usr/bin/awk -F= '$1 == "source_commit" {print $2}' "$CONTRACT")"
          RELEASE_FILE="MozkeyIbG_v${EXPECTED_RELEASE_VERSION}_macos_arm64.pkg"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(/usr/bin/awk -F= '$1 == "release_version" {print $2}' "$CONTRACT")" = "$EXPECTED_RELEASE_VERSION"
          test "$(/usr/bin/awk -F= '$1 == "release_filename" {print $2}' "$CONTRACT")" = "$RELEASE_FILE"
          test "${#EXPECTED_SHA}" -eq 64
          test "$(/usr/bin/shasum -a 256 "$OUT/$RELEASE_FILE" | /usr/bin/awk '{print $1}')" = "$EXPECTED_SHA"
          echo "SAME_INSTALLABLE_CANDIDATE=PASS"

      - name: Restore dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: zenz-formal-update-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies for native verifier probe
        working-directory: ./src
        shell: bash
        run: |
          set -euo pipefail
          python3 build_tools/update_deps.py

      - name: Verify same package and native scorer on Intel
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/installable-candidate"
          MOZKEY_ZENZ_EXPECTED_CONTRACT="$OUT/BUILD-CONTRACT.txt" \
          MOZKEY_ZENZ_VERIFY_BAZEL_ROOT="$HOME/.cache/bazel_mozkey_zenz_installable_intel_verify" \
            src/mac/installer/zenz_runtime/verify_release_package.zsh \
            "$OUT/MozkeyIbG_v${EXPECTED_RELEASE_VERSION}_macos_arm64.pkg" \
            "$OUT/intel-verify"
          install -m 0644 "$OUT/intel-verify/audit.txt" "$OUT/intel-audit.txt"

      - name: Upload native Intel audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: mozkey-ibg-macos-arm64-intel-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            installable-candidate/ARTIFACT-CONTRACT.txt
            installable-candidate/PREINSTALL-AUDIT.txt
            installable-candidate/intel-audit.txt
          if-no-files-found: error
          retention-days: 30
