name: CI for Windows
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_windows.md

on:
  pull_request:
    paths-ignore:
      - src/version.bzl
  push:
    branches:
      - main
  workflow_call:
    inputs:
      release:
        description: Build and upload release installers.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare_daily_dictionary:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      release_version: ${{ steps.release_version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: Resolve Mozkey release version
        id: release_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionFile = Get-Content .\src\version.bzl -Raw
          $parts = foreach ($name in @("MAJOR", "MINOR", "PATCH")) {
            $pattern = "(?m)^MOZKEY_RELEASE_VERSION_${name} = ([0-9]+)$"
            $match = [regex]::Match($versionFile, $pattern)
            if (-not $match.Success) {
              throw "Could not resolve MOZKEY_RELEASE_VERSION_${name}."
            }
            $match.Groups[1].Value
          }
          "value=$($parts -join '.')" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare daily dictionary
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\dictionary\prepare_daily_dictionary.ps1 -ReleaseApprovedOnly

      - name: upload daily dictionary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: windows-daily-dictionary
          path: |
            src/data/dictionary_koyasi/generated/**
            dist/dictionary/**
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  build_x64:
    needs: prepare_daily_dictionary
    if: ${{ inputs.release == true }}
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: windows-daily-dictionary
          path: .

      - name: Try to restore update_deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Prepare pinned x64 Zenz runtime
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          python .\tools\release\prepare_windows_zenz_runtime.py --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\tools\release\prepare_windows_zenz_runtime.py --arch x64 --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Qt
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Verify CRT redist selected by Visual Studio
        shell: pwsh
        run: |
          .\tools\release\verify_windows_crt.ps1 `
            -Architecture x64

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build --define=mozkey_dictionary_profile=release-approved-only package

      - name: Verify MSI artifact
        shell: pwsh
        run: |
          .\tools\release\check_windows_msi_offline.ps1 `
            -Path .\src\bazel-bin\win32\installer\Mozc64.msi `
            -RuntimePath .\src\win32\installer\zenz_runtime\generated\x64\llama-server.exe `
            -ExpectedRuntimeArchitecture x64

      - name: Probe x64 Zenz loopback runtime
        shell: pwsh
        run: |
          .\tools\release\probe_windows_zenz_runtime.ps1 `
            -RuntimePath .\src\win32\installer\zenz_runtime\generated\x64\llama-server.exe `
            -ModelPath .\src\win32\installer\zenz_runtime\generated\x64\models\zenz-v3.2-small-Q5_K_M.gguf

      - name: Stage versioned x64 MSI
        shell: pwsh
        run: |
          $destination = "MozkeyIbG_v${{ needs.prepare_daily_dictionary.outputs.release_version }}_x64.msi"
          Move-Item `
            -LiteralPath .\src\bazel-bin\win32\installer\Mozc64.msi `
            -Destination $destination

      - name: Upload versioned x64 MSI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: release-windows-x64
          path: MozkeyIbG_v${{ needs.prepare_daily_dictionary.outputs.release_version }}_x64.msi
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build_universal:
    needs: prepare_daily_dictionary
    if: ${{ inputs.release == true }}
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: windows-daily-dictionary
          path: .

      - name: Try to restore update_deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Prepare pinned x64 Zenz runtime
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          python .\tools\release\prepare_windows_zenz_runtime.py --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\tools\release\prepare_windows_zenz_runtime.py --arch x64 --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Qt
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Verify CRT redist selected by Visual Studio
        shell: pwsh
        run: |
          .\tools\release\verify_windows_crt.ps1 `
            -Architecture x64

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build --config win_universal_installer --define=mozkey_dictionary_profile=release-approved-only package

      - name: Verify MSI artifact
        shell: pwsh
        run: |
          .\tools\release\check_windows_msi_offline.ps1 `
            -Path .\src\bazel-bin\win32\installer\Mozc64.msi `
            -RuntimePath .\src\win32\installer\zenz_runtime\generated\x64\llama-server.exe `
            -ExpectedRuntimeArchitecture x64

      - name: Probe universal x64 Zenz loopback runtime
        shell: pwsh
        run: |
          .\tools\release\probe_windows_zenz_runtime.ps1 `
            -RuntimePath .\src\win32\installer\zenz_runtime\generated\x64\llama-server.exe `
            -ModelPath .\src\win32\installer\zenz_runtime\generated\x64\models\zenz-v3.2-small-Q5_K_M.gguf

      - name: Stage versioned universal MSI
        shell: pwsh
        run: |
          $destination = "MozkeyIbG_v${{ needs.prepare_daily_dictionary.outputs.release_version }}_universal.msi"
          Move-Item `
            -LiteralPath .\src\bazel-bin\win32\installer\Mozc64.msi `
            -Destination $destination

      - name: Upload versioned universal MSI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: release-windows-universal
          path: MozkeyIbG_v${{ needs.prepare_daily_dictionary.outputs.release_version }}_universal.msi
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build_arm64:
    needs: prepare_daily_dictionary
    if: ${{ inputs.release == true }}
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: windows-daily-dictionary
          path: .

      - name: Try to restore update_deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Prepare pinned ARM64 Zenz runtime
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          python .\tools\release\prepare_windows_zenz_runtime.py --arch arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\tools\release\prepare_windows_zenz_runtime.py --arch arm64 --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Qt (arm64)
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license --target_arch=arm64

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Verify CRT redist selected by Visual Studio
        shell: pwsh
        run: |
          .\tools\release\verify_windows_crt.ps1 `
            -Architecture arm64

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build --platforms=//:windows-arm64 --define=mozkey_dictionary_profile=release-approved-only

      - name: Verify MSI artifact
        shell: pwsh
        run: |
          .\tools\release\check_windows_msi_offline.ps1 `
            -Path .\src\bazel-bin\win32\installer\Mozc64.msi `
            -RuntimePath .\src\win32\installer\zenz_runtime\generated\arm64\llama-server.exe `
            -ExpectedRuntimeArchitecture arm64

      - name: Stage versioned ARM64 MSI
        shell: pwsh
        run: |
          $destination = "MozkeyIbG_v${{ needs.prepare_daily_dictionary.outputs.release_version }}_arm64.msi"
          Move-Item `
            -LiteralPath .\src\bazel-bin\win32\installer\Mozc64.msi `
            -Destination $destination

      - name: Upload versioned ARM64 MSI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: release-windows-arm64
          path: MozkeyIbG_v${{ needs.prepare_daily_dictionary.outputs.release_version }}_arm64.msi
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test:
    needs: prepare_daily_dictionary
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: windows-daily-dictionary
          path: .

      - name: Test Windows release and uninstall contracts
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest -v `
            tools.release.prepare_windows_zenz_runtime_test `
            tools.release.windows_uninstall_contract_test

      # Mozkey IbG installers package the runtime generated by
      # prepare_windows_zenz_runtime.py, so upstream's installed-MSI audit of
      # the checked-in llama-server.exe does not apply.  The lock-pinned
      # upstream reference assets are still tracked in this tree; keep them
      # and every pinned consumer synchronized with
      # src/zenz_runtime/llama_runtime.lock.json.  EXPECTED_LLAMA_SHA256 is
      # maintained by tools/zenz_runtime/runtime_lock.py sync.
      - name: Verify lock-pinned upstream reference Zenz runtime
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          EXPECTED_LLAMA_SHA256: 6BDE0FAF466261C8233298ECB2BDF01A78AAEBE9729C03BA4EA95F045F772737
        run: |
          $ErrorActionPreference = "Stop"
          $reference = ".\src\win32\installer\zenz_runtime\arm64\llama-server.exe"
          $actual = (Get-FileHash -LiteralPath $reference -Algorithm SHA256).Hash
          if ($actual -ne $env:EXPECTED_LLAMA_SHA256) {
            throw "ARM64 reference llama-server.exe SHA256 mismatch: $actual"
          }
          python .\tools\zenz_runtime\runtime_lock.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Try to restore update_deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: runtests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test ... -c dbg --build_tests_only --test_output=errors --define=mozkey_dictionary_profile=release-approved-only

      - name: Run portable Grimodex and Windows runtime contract tests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test //grimodex:portable_protocol_v1_tests //grimodex:protocol_v1_windows_secure_reader_test //grimodex:consumer_file_registrar_windows_test //protocol:renderer_callback_provenance_test //win32/tip:tip_edit_session_test //win32/tip:tip_grimodex_client_context_test //win32/tip:tip_grimodex_context_util_test //win32/tip:tip_input_mode_manager_test //session:zenz_named_pipe_client_test //session:zenz_named_pipe_availability_test -c dbg --test_output=errors --define=mozkey_dictionary_profile=release-approved-only

  test_arm64:
    needs: prepare_daily_dictionary
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: download daily dictionary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: windows-daily-dictionary
          path: .

      - name: Try to restore update_deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: runtests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test ... -c dbg --build_tests_only --test_output=errors --define=mozkey_dictionary_profile=release-approved-only

  test_arm64_tip_client_architecture:
    # Upstream Mozkey v1.0.0 audit, adapted to the Mozkey IbG identity.  It needs
    # the ARM64 MSI, which this fork only builds for releases; when build_arm64
    # is skipped (routine CI) this job is skipped with it.
    name: ARM64 TIP client-architecture smoke
    needs: build_arm64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/update_deps.py

      - name: Build native ARM64 and x64 TIP client smoke helpers
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build --define=mozkey_dictionary_profile=release-approved-only //win32/tip:tip_client_smoke_arm64 //win32/tip:tip_client_smoke_x64

      - name: Resolve, stage, and verify helper PE architectures
        shell: pwsh
        working-directory: .\src
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          function Get-PEMachine {
            param([Parameter(Mandatory = $true)][string]$Path)

            $stream = [System.IO.File]::Open(
              $Path,
              [System.IO.FileMode]::Open,
              [System.IO.FileAccess]::Read,
              [System.IO.FileShare]::Read
            )
            try {
              $reader = New-Object System.IO.BinaryReader($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) {
                throw "Not an MZ executable: $Path"
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadUInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Missing PE signature: $Path"
              }
              $machine = $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }

            switch ($machine) {
              0xAA64 { return "ARM64" }
              0x8664 { return "x64" }
              0x014C { return "x86" }
              default { return ("0x{0:X4}" -f $machine) }
            }
          }

          function Resolve-BazelOutput {
            param(
              [Parameter(Mandatory = $true)][string]$Target,
              [Parameter(Mandatory = $true)][string]$ExpectedFileName,
              [Parameter(Mandatory = $true)][string]$ExecutionRoot
            )

            $outputs = @(
              & bazelisk cquery --config release_build --define=mozkey_dictionary_profile=release-approved-only --output=files $Target |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
            if ($LASTEXITCODE -ne 0) {
              throw "bazelisk cquery failed for $Target with exit code $LASTEXITCODE"
            }

            Write-Host "cquery outputs for ${Target}:"
            $outputs | ForEach-Object { Write-Host "  $_" }

            $matching = @(
              $outputs |
                Where-Object {
                  [System.IO.Path]::GetFileName($_) -ieq $ExpectedFileName
                }
            )
            if ($matching.Count -ne 1) {
              throw (
                "Expected exactly one $ExpectedFileName output for $Target; " +
                "found $($matching.Count)"
              )
            }

            $resolved = Join-Path $ExecutionRoot $matching[0]
            if (-not (Test-Path $resolved -PathType Leaf)) {
              throw "Resolved Bazel output does not exist: $resolved"
            }

            return (Resolve-Path $resolved).Path
          }

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "This job is not running on native Windows ARM64."
          }

          $executionRootOutput = @(
            & bazelisk info --config release_build execution_root
          )
          if ($LASTEXITCODE -ne 0) {
            throw "bazelisk info execution_root failed with exit code $LASTEXITCODE"
          }

          Write-Host "bazelisk info execution_root raw output:"
          $executionRootOutput | ForEach-Object { Write-Host "  $_" }

          $executionRootCandidates = @(
            $executionRootOutput |
              ForEach-Object { ([string]$_).Trim() } |
              Where-Object {
                -not [string]::IsNullOrWhiteSpace($_) -and
                (Test-Path $_ -PathType Container)
              }
          )

          if ($executionRootCandidates.Count -ne 1) {
            throw (
              "Expected exactly one existing execution_root directory; " +
              "found $($executionRootCandidates.Count)"
            )
          }

          $executionRoot = [string]$executionRootCandidates[0]
          Write-Host "Bazel execution_root = $executionRoot"

          $armSource = Resolve-BazelOutput `
            -Target "//win32/tip:tip_client_smoke_arm64" `
            -ExpectedFileName "tip_client_smoke_arm64.exe" `
            -ExecutionRoot $executionRoot

          $x64Source = Resolve-BazelOutput `
            -Target "//win32/tip:tip_client_smoke_x64" `
            -ExpectedFileName "tip_client_smoke_x64.exe" `
            -ExecutionRoot $executionRoot

          $stage = Join-Path $env:RUNNER_TEMP "mozkey-tip-client-smoke"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $armHelper = Join-Path $stage "tip_client_smoke_arm64.exe"
          $x64Helper = Join-Path $stage "tip_client_smoke_x64.exe"

          Copy-Item $armSource $armHelper -Force
          Copy-Item $x64Source $x64Helper -Force

          $armMachine = Get-PEMachine $armHelper
          $x64Machine = Get-PEMachine $x64Helper

          Write-Host "ARM64 source  = $armSource"
          Write-Host "ARM64 staged  = $armHelper"
          Write-Host "ARM64 machine = $armMachine"
          Write-Host "x64 source    = $x64Source"
          Write-Host "x64 staged    = $x64Helper"
          Write-Host "x64 machine   = $x64Machine"

          if ($armMachine -ne "ARM64") {
            throw "Native helper is not ARM64."
          }
          if ($x64Machine -ne "x64") {
            throw "Cross-built helper is not x64."
          }

      - name: Download exact ARM64 MSI from this workflow run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          # A pattern (not a second "name:") keeps release artifact names unique
          # for tools/release/release_workflow_contract_test.py.
          pattern: release-windows-arm64
          merge-multiple: true
          path: ${{ runner.temp }}\mozkey-tip-smoke-msi

      - name: Install MSI and audit TIP client architecture routing
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $evidence = Join-Path $env:RUNNER_TEMP "mozkey-tip-client-architecture-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $msiCandidates = @(
            Get-ChildItem (Join-Path $env:RUNNER_TEMP "mozkey-tip-smoke-msi") `
              -Recurse -File -Filter *.msi
          )
          if ($msiCandidates.Count -ne 1) {
            throw "Expected exactly one ARM64 MSI artifact; found $($msiCandidates.Count)"
          }
          $msi = $msiCandidates[0].FullName

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "This job is not running on native Windows ARM64."
          }

          $installLog = Join-Path $evidence "install.log"
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i",
            "`"$msi`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$installLog`""
          )
          Write-Host "msiexec install exit = $($install.ExitCode)"
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "ARM64 MSI install failed: $($install.ExitCode)"
          }

          # Mozkey IbG TSF text service CLSID (src/win32/base/tsf_profile.cc).
          $clsid = "{2D046FEA-2B23-4E77-946B-FC2AF48219DC}"
          $subkey = "CLSID\$clsid\InProcServer32"

          function Get-ComRegistration {
            param(
              [Parameter(Mandatory = $true)]
              [Microsoft.Win32.RegistryView]$View
            )

            $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::ClassesRoot,
              $View
            )
            try {
              $key = $base.OpenSubKey($subkey, $false)
              if ($null -eq $key) {
                throw "COM registration not found in registry view $View`: $subkey"
              }
              try {
                return [pscustomobject]@{
                  View = [string]$View
                  Server = [string]$key.GetValue("")
                  ThreadingModel = [string]$key.GetValue("ThreadingModel")
                }
              } finally {
                $key.Dispose()
              }
            } finally {
              $base.Dispose()
            }
          }

          $reg64 = Get-ComRegistration `
            -View ([Microsoft.Win32.RegistryView]::Registry64)
          $reg32 = Get-ComRegistration `
            -View ([Microsoft.Win32.RegistryView]::Registry32)

          @($reg64, $reg32) |
            Export-Csv (Join-Path $evidence "com-registration.csv") `
              -NoTypeInformation -Encoding utf8

          Write-Host "64-bit COM server = $($reg64.Server)"
          Write-Host "32-bit COM server = $($reg32.Server)"

          if ([System.IO.Path]::GetFileName($reg64.Server) -ine "mozc_tip64x.dll") {
            throw "64-bit ARM64 COM registration does not point to mozc_tip64x.dll."
          }
          if ([System.IO.Path]::GetFileName($reg32.Server) -ine "mozc_tip32.dll") {
            throw "32-bit COM registration does not point to mozc_tip32.dll."
          }
          if ($reg64.ThreadingModel -ine "Apartment") {
            throw "64-bit TIP ThreadingModel is not Apartment."
          }
          if ($reg32.ThreadingModel -ine "Apartment") {
            throw "32-bit TIP ThreadingModel is not Apartment."
          }

          $stage = Join-Path $env:RUNNER_TEMP "mozkey-tip-client-smoke"
          $armHelper = Join-Path $stage "tip_client_smoke_arm64.exe"
          $x64Helper = Join-Path $stage "tip_client_smoke_x64.exe"

          $armLog = Join-Path $evidence "arm64-helper.log"
          & $armHelper *> $armLog
          $armExit = $LASTEXITCODE
          Get-Content $armLog | ForEach-Object { Write-Host $_ }
          if ($armExit -ne 0) {
            throw "Native ARM64 TIP client smoke failed: $armExit"
          }

          $x64Log = Join-Path $evidence "x64-helper.log"
          & $x64Helper *> $x64Log
          $x64Exit = $LASTEXITCODE
          Get-Content $x64Log | ForEach-Object { Write-Host $_ }
          if ($x64Exit -ne 0) {
            throw "x64-emulated TIP client smoke failed: $x64Exit"
          }

          @(
            "runner_arch=$env:PROCESSOR_ARCHITECTURE"
            "msi=$msi"
            "msi_sha256=$((Get-FileHash $msi -Algorithm SHA256).Hash)"
            "registry64_server=$($reg64.Server)"
            "registry32_server=$($reg32.Server)"
            "arm64_helper_exit=$armExit"
            "x64_helper_exit=$x64Exit"
            "TIP_CLIENT_ARCHITECTURE_SMOKE=PASS"
          ) | Set-Content (Join-Path $evidence "summary.txt") -Encoding utf8

      - name: Uninstall exact ARM64 MSI
        if: always()
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Continue"

          $evidence = Join-Path $env:RUNNER_TEMP "mozkey-tip-client-architecture-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $uninstallLog = Join-Path $evidence "uninstall.log"

          $msiCandidates = @(
            Get-ChildItem (Join-Path $env:RUNNER_TEMP "mozkey-tip-smoke-msi") `
              -Recurse -File -Filter *.msi -ErrorAction SilentlyContinue
          )

          if ($msiCandidates.Count -eq 0) {
            Write-Host "No MSI available for cleanup."
            exit 0
          }
          if ($msiCandidates.Count -ne 1) {
            Write-Error "Cleanup expected one MSI; found $($msiCandidates.Count)"
            exit 1
          }

          $msi = $msiCandidates[0].FullName
          $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/x",
            "`"$msi`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$uninstallLog`""
          )
          Write-Host "msiexec uninstall exit = $($uninstall.ExitCode)"

          if ($uninstall.ExitCode -notin @(0, 1605, 3010)) {
            Write-Error "ARM64 MSI cleanup failed: $($uninstall.ExitCode)"
            exit 1
          }

      - name: Upload TIP client-architecture smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: windows-arm64-tip-client-architecture-smoke
          path: ${{ runner.temp }}\mozkey-tip-client-architecture-evidence
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  test_arm64_tsf_application_host_foundation:
    # Upstream Mozkey v1.0.0 audit.  Release-only for the same reason as
    # test_arm64_tip_client_architecture.
    name: ARM64 installed-IME TSF application-host foundation
    needs: build_arm64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Build native ARM64 TSF application-host helper
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          Set-Location src
          & bazelisk build --config release_build --define=mozkey_dictionary_profile=release-approved-only //win32/tip:tsf_application_host_smoke_arm64
          if ($LASTEXITCODE -ne 0) {
            throw "ARM64 TSF application-host helper build failed with exit code $LASTEXITCODE"
          }

      - name: Resolve native ARM64 helper
        id: resolve_helper
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          Set-Location src

          $executionRootOutput = @(
            & bazelisk info --config release_build execution_root
          )
          if ($LASTEXITCODE -ne 0) {
            throw "bazelisk info execution_root failed with exit code $LASTEXITCODE"
          }

          Write-Host "bazelisk info execution_root raw output:"
          $executionRootOutput | ForEach-Object { Write-Host "  $_" }

          $executionRootCandidates = @(
            $executionRootOutput |
              ForEach-Object { ([string]$_).Trim() } |
              Where-Object {
                $_ -and
                (Test-Path -LiteralPath $_ -PathType Container)
              } |
              Select-Object -Unique
          )

          if ($executionRootCandidates.Count -ne 1) {
            throw (
              "Expected exactly one existing execution_root directory; " +
              "found $($executionRootCandidates.Count): " +
              ($executionRootCandidates -join ", ")
            )
          }

          [string]$executionRoot = $executionRootCandidates[0]
          Write-Host "Bazel execution_root = $executionRoot"

          $outputs = @(
            & bazelisk cquery --config release_build --define=mozkey_dictionary_profile=release-approved-only --output=files `
              //win32/tip:tsf_application_host_smoke_arm64 |
              ForEach-Object { ([string]$_).Trim() } |
              Where-Object { $_ }
          )
          if ($LASTEXITCODE -ne 0) {
            throw "bazelisk cquery failed with exit code $LASTEXITCODE"
          }

          Write-Host "cquery outputs:"
          $outputs | ForEach-Object { Write-Host "  $_" }

          $matches = @()
          foreach ($output in $outputs) {
            $candidate = if ([System.IO.Path]::IsPathRooted($output)) {
              $output
            } else {
              Join-Path $executionRoot $output
            }

            if (
              [System.IO.Path]::GetFileName($candidate) -eq
                "tsf_application_host_smoke_arm64.exe" -and
              (Test-Path -LiteralPath $candidate -PathType Leaf)
            ) {
              $matches += [System.IO.Path]::GetFullPath($candidate)
            }
          }

          $matches = @($matches | Select-Object -Unique)
          if ($matches.Count -ne 1) {
            throw (
              "Expected exactly one tsf_application_host_smoke_arm64.exe; " +
              "found $($matches.Count): " +
              ($matches -join ", ")
            )
          }

          $helper = $matches[0]
          Write-Host "Resolved helper = $helper"
          "helper=$helper" >> $env:GITHUB_OUTPUT

      - name: Download exact ARM64 MSI
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          # A pattern (not a second "name:") keeps release artifact names unique
          # for tools/release/release_workflow_contract_test.py.
          pattern: release-windows-arm64
          merge-multiple: true
          path: arm64-msi

      - name: Install exact ARM64 MSI
        id: install
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $msis = @(
            Get-ChildItem -LiteralPath arm64-msi -Recurse -File -Filter *.msi
          )
          if ($msis.Count -ne 1) {
            throw "Expected exactly one ARM64 MSI; found $($msis.Count)"
          }

          $msi = $msis[0].FullName
          Write-Host "MSI = $msi"
          Get-FileHash -LiteralPath $msi -Algorithm SHA256

          $installLog = Join-Path $env:RUNNER_TEMP "tsf-host-install.log"
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i",
            "`"$msi`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$installLog`""
          )

          Write-Host "msiexec install exit = $($process.ExitCode)"
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "ARM64 MSI install failed with exit code $($process.ExitCode)"
          }

          "msi=$msi" >> $env:GITHUB_OUTPUT
          "install_log=$installLog" >> $env:GITHUB_OUTPUT

      - name: Run installed-IME TSF application-host foundation
        id: smoke
        shell: pwsh
        env:
          HELPER: ${{ steps.resolve_helper.outputs.helper }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath $env:HELPER -PathType Leaf)) {
            throw "Resolved helper does not exist: $env:HELPER"
          }

          $log = Join-Path $env:RUNNER_TEMP "tsf-application-host-foundation.log"

          & $env:HELPER 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE

          Write-Host "helper exit = $exitCode"
          if ($exitCode -ne 0) {
            throw "TSF application-host foundation failed with exit code $exitCode"
          }

          $content = Get-Content -LiteralPath $log -Raw
          foreach ($required in @(
            "process_architecture=ARM64",
            "gate_active_profile=PASS",
            "gate_document_focus=PASS",
            "gate_top_context=PASS",
            "gate_ime_open=PASS",
            "gate_hiragana_mode=PASS",
            "gate_text_store_sink=PASS",
            "gate_foreground_service=PASS",
            "gate_arm64_tip=PASS",
            "TSF_APPLICATION_HOST_FOUNDATION=PASS"
          )) {
            if ($content -notmatch [regex]::Escape($required)) {
              throw "Required helper evidence missing: $required"
            }
          }

          "log=$log" >> $env:GITHUB_OUTPUT

      - name: Uninstall exact ARM64 MSI
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        env:
          MSI: ${{ steps.install.outputs.msi }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $uninstallLog = Join-Path $env:RUNNER_TEMP "tsf-host-uninstall.log"
          # Start-Process -Wait waits for the full descendant tree.  An
          # unrelated surviving descendant must not block MSI client cleanup.
          # Wait directly for this msiexec client, with a bounded timeout.
          $process = Start-Process msiexec.exe -PassThru -ArgumentList @(
            "/x",
            "`"$env:MSI`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$uninstallLog`""
          )
          Write-Host "MSI_UNINSTALL_CLIENT_PID=$($process.Id)"
          if (-not $process.WaitForExit(180000)) {
            Write-Host "MSI_UNINSTALL_CLIENT_TIMEOUT=180s"
            if (Test-Path -LiteralPath $uninstallLog) {
              Write-Host "===== MSI uninstall log tail ====="
              Get-Content -LiteralPath $uninstallLog -Tail 80 |
                ForEach-Object { Write-Host $_ }
            }
            throw "ARM64 MSI uninstall client did not exit within 180 seconds"
          }

          $exitCode = $process.ExitCode
          Write-Host "MSI_UNINSTALL_CLIENT_EXIT=$exitCode"
          if ($exitCode -notin @(0, 1605, 3010)) {
            throw "ARM64 MSI uninstall failed with exit code $exitCode"
          }

      - name: Upload TSF application-host evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: windows-arm64-tsf-application-host-foundation
          path: |
            ${{ runner.temp }}/tsf-application-host-foundation.log
            ${{ runner.temp }}/tsf-host-install.log
            ${{ runner.temp }}/tsf-host-uninstall.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
