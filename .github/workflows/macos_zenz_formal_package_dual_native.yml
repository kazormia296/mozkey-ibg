name: macOS Zenz formal package dual-native validation

# Mozkey IbG: on-demand audit only.  Routine CI in this fork never builds
# product packages, and every release already runs the same package verifier
# (verify_release_package.zsh) in macos.yaml's build_arm64 job.  This workflow
# additionally exercises the Universal Zenz runtime natively on Intel and the
# real-scorer SIGKILL behaviour.  The application itself is arm64-only in
# Mozkey IbG (src/mac/installer/distribution.xml), so the package is built with
# --macos_cpus=arm64 and the verifier is told to expect an arm64 application;
# the runtime helpers are Universal regardless.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOZKEY_ZENZ_VERIFY_APP_ARCHITECTURES: arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_verify_arm64:
    name: Build formal PKG and verify on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout Mozkey
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: Verify Apple Silicon build host
        shell: /bin/zsh {0}
        run: |
          set -eux
          test "$(/usr/bin/uname -m)" = "arm64"
          /usr/bin/sw_vers
          /usr/bin/xcodebuild -version
          cmake --version
          bazelisk version

      - name: Prepare daily dictionary
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/dictionary/prepare_daily_dictionary.ps1 -ReleaseApprovedOnly

      - name: Restore dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: zenz-formal-update-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        working-directory: ./src
        run: |
          python3 build_tools/update_deps.py

      - name: Build arm64 Qt
        working-directory: ./src
        run: |
          python3 build_tools/build_qt.py \
            --release \
            --confirm_license \
            --macos_cpus=arm64

      - name: Build formal Universal Zenz runtime from pinned source
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail

          RUNTIME="$RUNNER_TEMP/mozkey-zenz-formal-runtime"
          rm -rf "$RUNTIME"

          # Use the tracked, lock-pinned source model; the builder verifies it.
          MOZKEY_ZENZ_MODEL_SOURCE="$GITHUB_WORKSPACE/src/win32/installer/zenz_runtime/models/zenz-v3.2-small-Q5_K_M.gguf" \
            src/mac/installer/zenz_runtime/build_universal_runtime.zsh \
            "$RUNTIME"

          test -f "$RUNTIME/llama-server"
          test -f "$RUNTIME/BUILD-CONTRACT.txt"
          test -f "$RUNTIME/models/zenz-v3.2-small-Q5_K_M.gguf"

          echo "===== FORMAL RUNTIME CONTRACT ====="
          cat "$RUNTIME/BUILD-CONTRACT.txt"

          echo "===== FORMAL RUNTIME IDENTITIES ====="
          /usr/bin/shasum -a 256 \
            "$RUNTIME/llama-server" \
            "$RUNTIME/BUILD-CONTRACT.txt" \
            "$RUNTIME/models/zenz-v3.2-small-Q5_K_M.gguf"

      - name: Stage formal runtime
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail

          RUNTIME="$RUNNER_TEMP/mozkey-zenz-formal-runtime"

          src/mac/installer/zenz_runtime/stage_runtime_assets.zsh \
            "$RUNTIME"

          test -f src/mac/installer/zenz_runtime/llama-server
          test -f src/mac/installer/zenz_runtime/BUILD-CONTRACT.txt
          test -f \
            src/mac/installer/zenz_runtime/models/zenz-v3.2-small-Q5_K_M.gguf

      - name: Build exact formal Universal Zenz PKG
        working-directory: ./src
        run: |
          bazelisk \
            --output_user_root="$HOME/.cache/bazel_mozkey_zenz_formal_pkg" \
            build \
            --config=oss_macos \
            --config=release_build \
            --macos_cpus=arm64 \
            --define=mozkey_dictionary_profile=release-approved-only \
            --define=macos_zenz_runtime=1 \
            //mac:package \
            --verbose_failures

      - name: Capture exact package artifact
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail

          ARTIFACT="$GITHUB_WORKSPACE/formal-package"
          mkdir -p "$ARTIFACT"

          install \
            -m 0644 \
            src/bazel-bin/mac/MozkeyIbG.pkg \
            "$ARTIFACT/MozkeyIbG_Zenz_Universal_formal_dev.pkg"

          install \
            -m 0644 \
            src/mac/installer/zenz_runtime/BUILD-CONTRACT.txt \
            "$ARTIFACT/BUILD-CONTRACT.txt"

          PACKAGE_SHA="$(
            /usr/bin/shasum -a 256 \
              "$ARTIFACT/MozkeyIbG_Zenz_Universal_formal_dev.pkg" |
            /usr/bin/awk '{print $1}'
          )"

          CONTRACT_SHA="$(
            /usr/bin/shasum -a 256 \
              "$ARTIFACT/BUILD-CONTRACT.txt" |
            /usr/bin/awk '{print $1}'
          )"

          {
            echo "package_sha256=$PACKAGE_SHA"
            echo "build_contract_sha256=$CONTRACT_SHA"
            echo "source_commit=$GITHUB_SHA"
          } > "$ARTIFACT/ARTIFACT-CONTRACT.txt"

          echo "Package SHA256       = $PACKAGE_SHA"
          echo "BUILD-CONTRACT SHA256= $CONTRACT_SHA"
          cat "$ARTIFACT/ARTIFACT-CONTRACT.txt"

      - name: Verify exact package on Apple Silicon
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail

          ARTIFACT="$GITHUB_WORKSPACE/formal-package"

          MOZKEY_ZENZ_EXPECTED_CONTRACT="$ARTIFACT/BUILD-CONTRACT.txt" \
          MOZKEY_ZENZ_VERIFY_BAZEL_ROOT="$HOME/.cache/bazel_mozkey_zenz_formal_pkg" \
            src/mac/installer/zenz_runtime/verify_release_package.zsh \
            "$ARTIFACT/MozkeyIbG_Zenz_Universal_formal_dev.pkg" \
            "$ARTIFACT/arm64-verify"

          install \
            -m 0644 \
            "$ARTIFACT/arm64-verify/audit.txt" \
            "$ARTIFACT/arm64-audit.txt"

      - name: Upload exact formal package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: mozkey-ibg-zenz-formal-universal-package
          path: |
            formal-package/MozkeyIbG_Zenz_Universal_formal_dev.pkg
            formal-package/BUILD-CONTRACT.txt
            formal-package/ARTIFACT-CONTRACT.txt
            formal-package/arm64-audit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Final Apple Silicon audit
        if: always()
        shell: /bin/zsh {0}
        run: |
          echo "===== APPLE SILICON FINAL AUDIT ====="
          echo "Host = $(/usr/bin/uname -m)"
          /usr/bin/sw_vers

          echo
          echo "===== ARTIFACT CONTRACT ====="
          cat formal-package/ARTIFACT-CONTRACT.txt 2>/dev/null || true

          echo
          echo "===== ARM64 PACKAGE AUDIT ====="
          cat formal-package/arm64-audit.txt 2>/dev/null || true

  verify_real_scorer_sigkill_noninterference:
    name: Real scorer SIGKILL and unrelated worker (${{ matrix.arch }})
    needs: build_and_verify_arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout identical Mozkey commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: Download exact formal package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: mozkey-ibg-zenz-formal-universal-package
          path: formal-package

      - name: Validate source, architecture, and package identity
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          test "$(/usr/bin/uname -m)" = '${{ matrix.arch }}'
          CONTRACT="formal-package/ARTIFACT-CONTRACT.txt"
          PACKAGE="formal-package/MozkeyIbG_Zenz_Universal_formal_dev.pkg"
          test -f "$CONTRACT" && test -f "$PACKAGE"
          SOURCE_SHA="$(/usr/bin/awk -F= '$1 == "source_commit" {print $2}' "$CONTRACT")"
          PACKAGE_SHA="$(/usr/bin/awk -F= '$1 == "package_sha256" {print $2}' "$CONTRACT")"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "${#PACKAGE_SHA}" -eq 64
          test "$(/usr/bin/shasum -a 256 "$PACKAGE" | /usr/bin/awk '{print $1}')" = "$PACKAGE_SHA"
          echo "SOURCE_AND_PKG_IDENTITY=PASS native=${{ matrix.arch }}"

      - name: Test real scorer SIGKILL and unrelated worker noninterference
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          CONTRACT="formal-package/ARTIFACT-CONTRACT.txt"
          PACKAGE_SHA="$(/usr/bin/awk -F= '$1 == "package_sha256" {print $2}' "$CONTRACT")"
          /usr/bin/python3 -B \
            src/mac/installer/zenz_runtime/verify_dual_liveness_sigkill_ci.py \
            --package formal-package/MozkeyIbG_Zenz_Universal_formal_dev.pkg \
            --expected-sha256 "$PACKAGE_SHA" \
            --output-root "$RUNNER_TEMP/pr3-real-scorer-sigkill"

      - name: Upload SIGKILL verification summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: mozkey-ibg-real-scorer-sigkill-${{ matrix.arch }}
          path: ${{ runner.temp }}/pr3-real-scorer-sigkill/result.json
          if-no-files-found: warn
          retention-days: 7

  verify_same_package_on_native_intel:
    name: Verify same formal PKG on native Intel
    needs: build_and_verify_arm64
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout identical Mozkey commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: false
          persist-credentials: false

      - name: Download exact formal package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: mozkey-ibg-zenz-formal-universal-package
          path: formal-package

      - name: Verify Intel host and exact artifact identity
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail

          test "$(/usr/bin/uname -m)" = "x86_64"

          ARTIFACT="$GITHUB_WORKSPACE/formal-package"
          CONTRACT="$ARTIFACT/ARTIFACT-CONTRACT.txt"

          EXPECTED_PACKAGE_SHA="$(
            /usr/bin/awk \
              -F= \
              '$1 == "package_sha256" {print $2}' \
              "$CONTRACT"
          )"

          EXPECTED_CONTRACT_SHA="$(
            /usr/bin/awk \
              -F= \
              '$1 == "build_contract_sha256" {print $2}' \
              "$CONTRACT"
          )"

          EXPECTED_SOURCE_COMMIT="$(
            /usr/bin/awk \
              -F= \
              '$1 == "source_commit" {print $2}' \
              "$CONTRACT"
          )"

          ACTUAL_PACKAGE_SHA="$(
            /usr/bin/shasum -a 256 \
              "$ARTIFACT/MozkeyIbG_Zenz_Universal_formal_dev.pkg" |
            /usr/bin/awk '{print $1}'
          )"

          ACTUAL_CONTRACT_SHA="$(
            /usr/bin/shasum -a 256 \
              "$ARTIFACT/BUILD-CONTRACT.txt" |
            /usr/bin/awk '{print $1}'
          )"

          echo "Expected package SHA = $EXPECTED_PACKAGE_SHA"
          echo "Actual package SHA   = $ACTUAL_PACKAGE_SHA"
          echo "Expected contract SHA= $EXPECTED_CONTRACT_SHA"
          echo "Actual contract SHA  = $ACTUAL_CONTRACT_SHA"
          echo "Expected source SHA  = $EXPECTED_SOURCE_COMMIT"
          echo "Checkout source SHA  = $GITHUB_SHA"

          test "$ACTUAL_PACKAGE_SHA" = "$EXPECTED_PACKAGE_SHA"
          test "$ACTUAL_CONTRACT_SHA" = "$EXPECTED_CONTRACT_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_COMMIT"

          /usr/bin/sw_vers

      - name: Restore dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: src/third_party_cache
          key: zenz-formal-update-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies for native verifier probe
        working-directory: ./src
        run: |
          python3 build_tools/update_deps.py

      - name: Verify exact same package on native Intel
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail

          ARTIFACT="$GITHUB_WORKSPACE/formal-package"

          MOZKEY_ZENZ_EXPECTED_CONTRACT="$ARTIFACT/BUILD-CONTRACT.txt" \
          MOZKEY_ZENZ_VERIFY_BAZEL_ROOT="$HOME/.cache/bazel_mozkey_zenz_intel_verify" \
            src/mac/installer/zenz_runtime/verify_release_package.zsh \
            "$ARTIFACT/MozkeyIbG_Zenz_Universal_formal_dev.pkg" \
            "$ARTIFACT/intel-verify"

          install \
            -m 0644 \
            "$ARTIFACT/intel-verify/audit.txt" \
            "$ARTIFACT/intel-audit.txt"

      - name: Upload native Intel audit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: mozkey-ibg-zenz-formal-native-intel-audit
          path: |
            formal-package/ARTIFACT-CONTRACT.txt
            formal-package/intel-audit.txt
            formal-package/intel-verify/packaged-scorer.log
          if-no-files-found: warn
          retention-days: 7

      - name: Final native Intel audit
        if: always()
        shell: /bin/zsh {0}
        run: |
          echo "===== NATIVE INTEL FINAL AUDIT ====="
          echo "Host = $(/usr/bin/uname -m)"
          /usr/bin/sw_vers

          echo
          echo "===== ARTIFACT CONTRACT ====="
          cat formal-package/ARTIFACT-CONTRACT.txt 2>/dev/null || true

          echo
          echo "===== INTEL PACKAGE AUDIT ====="
          cat formal-package/intel-audit.txt 2>/dev/null || true

          echo
          echo "===== PACKAGED SCORER LOG TAIL ====="
          tail -n 300 \
            formal-package/intel-verify/packaged-scorer.log \
            2>/dev/null || true
